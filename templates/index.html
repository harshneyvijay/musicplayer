<!DOCTYPE html>
<html>
<head>
    <img id="cover" src="{{ url_for('static', filename='default.jpg') }}">
    <title>Music Player</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="sidebar">
        <h2>🎧 Playlist</h2>
        <ul id="playlist">
            {% for song in songs %}
                <li onclick="playSong('{{ song }}')">{{ song }}</li>
            {% endfor %}
        </ul>
    </div>

    <div class="player">
        <h1 id="title">Select a song</h1>

        <audio id="audio"></audio>

        <div class="controls">
            <button onclick="prev()">⏪</button>
            <button onclick="toggle()" id="playBtn">▶</button>
            <button onclick="next()">⏩</button>
        </div>

        <input type="range" id="progress" value="0">

        <div id="time">00:00 / 00:00</div>

        <input type="range" id="volume" min="0" max="1" step="0.01">
    </div>

</div>

<!-- ✅ PASS SONGS TO JS -->
<script>
    const songs = JSON.parse('{{ songs | tojson | safe }}');
</script>

<!-- ✅ CONNECT JS -->
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
